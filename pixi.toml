[workspace]
authors = ["shivasankar"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://conda.modular.com/max-nightly"]
description = "Mantle is a stand-alone machine learning framework that leverages the power of Mojo."
name = "Mantle"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
test = { cmd = "mojo test -I . tests" }
test_mojo = { cmd = "mojo test -I . tests/mojo" }
test_python = { cmd = "mojo test -I . tests/python" }
format = { cmd = "mojo format mantle/" }
precompile = { cmd = "mojo precompile mantle -o mantle.mojoc" }

[dependencies]
pytorch = ">=2.12.1,<3"
torchvision = ">=0.27.1,<0.28"
torchaudio = ">=2.11.0,<3"
onnx = ">=1.22.0,<2"
pandas = ">=3.0.3,<4"
mojo = ">=1.1.0,<2"
matplotlib = ">=3.11.0,<4"
netron = ">=9.1.3,<10"
max-core = ">=26.6.0,<27"

[pypi-dependencies]
